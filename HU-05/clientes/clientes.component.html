<div class="clientes-container">
  <h2>Gestión de Clientes</h2>

  <div class="form-card" id="formularioCliente">
    <h3>{{ clienteSeleccionado ? 'Editar Cliente: ' + clienteSeleccionado.nombre : 'Nuevo Cliente' }}</h3>
    <form #clienteForm="ngForm">
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" 
               id="nombre" 
               name="nombre" 
               [(ngModel)]="newCliente.nombre" 
               required
               placeholder="Ingrese el nombre del cliente">
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono:</label>
        <input type="number" 
               id="telefono" 
               name="telefono" 
               [(ngModel)]="newCliente.telefono" 
               required
               placeholder="Ingrese el teléfono">
      </div>

      <div class="form-group">
        <label for="status">Estado:</label>
        <select id="status" 
                name="status" 
                [(ngModel)]="newCliente.status">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" 
                (click)="guardarCliente()" 
                class="btn-primary" 
                [class.isLoading]="isLoading">
          {{ clienteSeleccionado ? 'Actualizar Cliente' : 'Guardar Cliente' }}
        </button>
        <button *ngIf="clienteSeleccionado" 
                type="button" 
                (click)="cancelarEdicion()" 
                class="btn-secondary cancelar">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div class="list-card">
    <h3>Listado de Clientes</h3>
    <ul *ngIf="clientes.length > 0; else noClientes">
      <li *ngFor="let cliente of clientes">
        <div class="cliente-info">
          <span class="cliente-nombre">{{ cliente.nombre }}</span>
          <span class="cliente-telefono">Tel: {{ cliente.telefono }}</span>
          <span class="cliente-estado" [class.activo]="cliente.status" [class.inactivo]="!cliente.status">
            {{ cliente.status ? 'Activo' : 'Inactivo' }}
          </span>
        </div>
        <div class="cliente-actions">
          <button class="btn-primary editar" 
                  (click)="editarCliente(cliente)">
            <i class="fas fa-edit"></i> Editar
          </button>
          <button class="btn-secondary" (click)="eliminarCliente(cliente)">
            <i class="fas fa-trash"></i> Eliminar
          </button>
        </div>
      </li>
    </ul>
    <ng-template #noClientes>
      <p class="no-clientes">No hay clientes registrados aún.</p>
    </ng-template>
  </div>
</div>
